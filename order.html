<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status Lookup</title>
      <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <a href="index.html">&larr; Back to Home</a>
        <h2>Check your Order Status</h2>
        <section>
            <p class="demo-ids">
                <code>NS1001</code>
                <code>NS1002</code>
                <code>NS1003</code>
            </p>
            <label for="order-number">Order ID:</label>
        
            <input
            type="text"
            id="order-number"
            name="order-number"
            placeholder="ex: NS1001"
            >
            <button id="check-order">Check Status</button>
            <div id="order-result">

            </div>
        </section>
    </main>

    <script src="order.js" defer></script>
</body>
</html>
